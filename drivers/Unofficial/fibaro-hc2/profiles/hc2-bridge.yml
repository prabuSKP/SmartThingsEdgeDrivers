name: hc2-bridge
components:
  - id: main
    capabilities:
      - id: refresh
        version: 1
    categories:
      - name: Bridges
preferences:
  - name: scheme
    title: Protocol
    description: Auto-detected for mDNS-discovered bridges. Only set manually to override (http or https).
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 5
      default: ""
  - name: host
    title: Fibaro Host
    description: Auto-populated by mDNS discovery. Leave empty for discovered bridges. Set manually only for HC2 or to override the discovered address.
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 255
      default: ""
  - name: port
    title: Fibaro Port
    description: Auto-detected for mDNS-discovered bridges. Leave empty to use the default (80 for HTTP, 443 for HTTPS).
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 5
      default: ""
  - name: username
    title: Fibaro Username
    description: Username for Fibaro HC2 or HC3 Basic Auth. Required for device sync.
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 255
      default: ""
  - name: password
    title: Fibaro Password
    description: Password for Fibaro HC2 or HC3 Basic Auth. Required for device sync.
    required: false
    preferenceType: string
    definition:
      stringType: password
      minLength: 0
      maxLength: 255
      default: ""
  - name: pollInterval
    title: Poll Interval (Seconds)
    description: Interval for inventory and state sync. Lower values increase LAN traffic.
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 3600
      default: 30

