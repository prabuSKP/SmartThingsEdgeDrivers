name: hc2-bridge
components:
  - id: main
    capabilities:
      - id: refresh
        version: 1
    categories:
      - name: Bridges
preferences:
  - name: scheme
    title: Protocol
    description: Use `http` for HC2 or `https` for HC3 when local TLS is enabled.
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 5
      default: "http"
  - name: host
    title: Fibaro Host
    description: IPv4 address or hostname of the Fibaro HC2 or HC3 controller.
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 255
      default: ""
  - name: port
    title: Fibaro Port
    description: Local API port. Leave empty to use `80` for HTTP or `443` for HTTPS.
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 5
      default: ""
  - name: username
    title: Fibaro Username
    description: Username for Fibaro HC2 or HC3 Basic Auth.
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 255
      default: ""
  - name: password
    title: Fibaro Password
    description: Password for Fibaro HC2 or HC3 Basic Auth.
    required: false
    preferenceType: string
    definition:
      stringType: password
      minLength: 0
      maxLength: 255
      default: ""
  - name: pollInterval
    title: Poll Interval (Seconds)
    description: Interval for inventory and state sync. Lower values increase LAN traffic.
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 3600
      default: 30
