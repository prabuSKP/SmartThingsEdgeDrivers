name: rm4-hub
components:
  - id: main
    capabilities:
      - id: refresh
        version: 1
    categories:
      - name: RemoteController
preferences:
  - name: applianceType
    title: "Appliance type to add"
    description: "Pick the type, then set a name below and Save to create the appliance."
    required: false
    preferenceType: enumeration
    definition:
      options:
        # Only AC / TV / Generic are offered in the app. The `fan` and `media` profiles and
        # their handlers are intentionally retained in the driver (init.lua PROFILE, ir-fan.yml,
        # ir-media.yml) but hidden here — re-add the options below to expose them again.
        ac: "Air Conditioner"
        tv: "TV"
        generic: "Generic"
      default: "ac"
  - name: applianceName
    title: "Appliance name (Save to add)"
    description: "Type a name (e.g. Living Room TV) and Save — a new appliance of the chosen type is created. Use a different name to add another."
    required: false
    preferenceType: string
    definition:
      stringType: text
      minLength: 0
      maxLength: 40
      default: ""
