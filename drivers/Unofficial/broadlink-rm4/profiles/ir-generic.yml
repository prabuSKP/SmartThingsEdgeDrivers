name: ir-generic
components:
  - id: main
    capabilities:
      - id: switch
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: RemoteController
  - id: button1
    capabilities:
      - id: momentary
        version: 1
  - id: button2
    capabilities:
      - id: momentary
        version: 1
  - id: button3
    capabilities:
      - id: momentary
        version: 1
  - id: button4
    capabilities:
      - id: momentary
        version: 1
preferences:
